<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WIGO — Logo Package</title>
<style>
 body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0f0f10;color:#eee}
 header{padding:40px 24px 10px;text-align:center}
 h1{font-weight:700;letter-spacing:2px;margin:0;font-size:20px;color:#E8791E}
 p.sub{color:#888;font-size:13px;letter-spacing:3px;margin-top:6px}
 .grid{display:grid;gap:22px;max-width:1000px;margin:30px auto;padding:0 20px}
 .card{background:#1c1c1e;border:1px solid #2a2a2c;border-radius:14px;overflow:hidden}
 .card .label{padding:12px 18px;font-size:12px;letter-spacing:2px;color:#aaa;border-bottom:1px solid #2a2a2c;text-transform:uppercase}
 .card .body{display:flex;align-items:center;justify-content:center;padding:20px;min-height:220px}
 .card.light .body{background:#fff}
 .card svg,.card img{max-width:100%;height:auto}
 .replay{cursor:pointer;color:#E8791E;font-size:11px;float:right}
</style></head>
<body>
<header><h1>WIGO</h1><p class="sub">LOGO PACKAGE</p></header>
<div class="grid">
 <div class="card">
   <div class="label">Animated <span class="replay" onclick="var s=this.closest('.card').querySelector('.body');var h=s.innerHTML;s.innerHTML='';s.offsetHeight;s.innerHTML=h;">↻ replay</span></div>
   <div class="body"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 808 663" width="808" height="663" role="img" aria-label="WIGO animated logo">
  <rect width="808" height="663" fill="#1c1c1e"/>

  <style>
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%,100% { opacity:.25; } 50% { opacity:1; } }
    @keyframes ringpop { 0% { transform: scale(.4); opacity:0; } 60% { opacity:1; } 100% { transform: scale(1); opacity:1; } }
    @keyframes fadein { to { opacity:1; } }

    .letter { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 1.4s ease forwards; }
    #w { animation-delay:.1s } #i { animation-delay:.5s } #g { animation-delay:.7s } #o { animation-delay:1s }

    .mast { stroke-dasharray: 210; stroke-dashoffset: 210; animation: draw .7s ease .3s forwards; }
    .ring { transform-box: fill-box; transform-origin: center; opacity:0; animation: ringpop .5s ease 1s forwards; }

    .wave { opacity:.25; }
    #wi1 { animation: pulse 2s ease-in-out 1.4s infinite; }
    #wi2 { animation: pulse 2s ease-in-out 1.4s infinite; }
    #wo1 { animation: pulse 2s ease-in-out 1.6s infinite; }
    #wo2 { animation: pulse 2s ease-in-out 1.6s infinite; }

    .tag { opacity:0; animation: fadein .8s ease 1.5s forwards; }

    @media (prefers-reduced-motion: reduce){
      .letter,.mast{ stroke-dashoffset:0; animation:none; }
      .ring,.tag{ opacity:1; animation:none; }
      .wave{ opacity:1; animation:none; }
    }
  </style>

  <!-- ANTENNA -->
  <g fill="none" stroke="#E8791E" stroke-width="11" stroke-linecap="round">
    <path id="wi1" class="wave" d="M 348 168 A 38 38 0 0 0 348 232"/>
    <path id="wi2" class="wave" d="M 396 168 A 38 38 0 0 1 396 232"/>
    <path id="wo1" class="wave" d="M 327 152 A 62 62 0 0 0 327 248"/>
    <path id="wo2" class="wave" d="M 417 152 A 62 62 0 0 1 417 248"/>
  </g>
  <line class="mast" x1="372" y1="196" x2="372" y2="392" stroke="#E8791E" stroke-width="9" stroke-linecap="round"/>
  <circle class="ring" cx="372" cy="182" r="14" fill="none" stroke="#E8791E" stroke-width="11"/>

  <!-- WIGO -->
  <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <path id="w" class="letter" d="M 190 250 L 190 362 a 42 42 0 0 0 42 42 a 42 42 0 0 0 39 -26 a 42 42 0 0 0 39 26 a 42 42 0 0 0 42 -42 L 352 250 L 326 250 L 326 362 a 15 15 0 0 1 -30 0 L 296 250 L 266 250 L 266 362 a 15 15 0 0 1 -30 0 L 236 250 Z"/>
    <rect id="i" class="letter" x="355" y="250" width="34" height="154" rx="6"/>
    <path id="g" class="letter" d="M 520 300 a 44 44 0 0 0 -44 -50 L 470 250 a 42 42 0 0 0 -42 42 L 428 362 a 42 42 0 0 0 42 42 L 478 404 a 42 42 0 0 0 42 -42 L 520 320 L 476 320 L 476 350 L 491 350 L 491 362 a 11 11 0 0 1 -11 11 L 470 373 a 11 11 0 0 1 -11 -11 L 459 294 a 11 11 0 0 1 11 -11 L 478 283 a 13 13 0 0 1 13 15 Z"/>
    <rect id="o" class="letter" x="558" y="250" width="88" height="154" rx="44"/>
    <rect id="o2" class="letter" x="585" y="278" width="34" height="98" rx="17" style="animation-delay:1.1s"/>
  </g>

  <text class="tag" x="404" y="450" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24" letter-spacing="8" fill="#FFFFFF">CLICK I CONNECT I WIGO</text>
</svg></div>
 </div>
 <div class="card"><div class="label">Primary — dark background</div><div class="body"><img src="wigo-logo-dark.png"></div></div>
 <div class="card light"><div class="label">Light background (for website)</div><div class="body"><img src="wigo-logo-light.png"></div></div>
 <div class="card"><div class="label">Transparent (drops on any background)</div><div class="body" style="background:linear-gradient(45deg,#333,#555)"><img src="wigo-logo-transparent.png"></div></div>
</div>
</body></html>
