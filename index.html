<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>WIGO — Animated Logo</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f0f10;
      color: #eee;
    }

    header {
      padding: 40px 24px 10px;
      text-align: center;
    }

    h1 {
      font-weight: 700;
      letter-spacing: 2px;
      margin: 0;
      font-size: 20px;
      color: #E8791E;
    }

    p.sub {
      color: #888;
      font-size: 13px;
      letter-spacing: 3px;
      margin-top: 6px;
    }

    .card {
      background: #1c1c1e;
      border: 1px solid #2a2a2c;
      border-radius: 14px;
      overflow: hidden;
      max-width: 1000px;
      margin: 30px auto;
    }

    .card .label {
      padding: 12px 18px;
      font-size: 12px;
      letter-spacing: 2px;
      color: #aaa;
      border-bottom: 1px solid #2a2a2c;
      text-transform: uppercase;
    }

    .card .body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      min-height: 220px;
    }

    .card svg {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .replay {
      cursor: pointer;
      color: #E8791E;
      font-size: 11px;
      float: right;
    }
  </style>
</head>

<body>

  <header>
    <h1>WIGO</h1>
    <p class="sub">ANIMATED LOGO</p>
  </header>

  <div class="card">

    <div class="label">
      Animated
      <span
        class="replay"
        onclick="
          var s=this.closest('.card').querySelector('.body');
          var h=s.innerHTML;
          s.innerHTML='';
          s.offsetHeight;
          s.innerHTML=h;
        "
      >
        ↻ replay
      </span>
    </div>

    <div class="body">

      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 808 663"
        width="808"
        height="663"
        role="img"
        aria-label="WIGO animated logo"
      >

        <rect
          width="808"
          height="663"
          fill="#1c1c1e"
        />

        <style>
          @keyframes draw {
            to {
              stroke-dashoffset: 0;
            }
          }

          @keyframes pulse {
            0%, 100% {
              opacity: .25;
            }

            50% {
              opacity: 1;
            }
          }

          @keyframes ringpop {
            0% {
              transform: scale(.4);
              opacity: 0;
            }

            60% {
              opacity: 1;
            }

            100% {
              transform: scale(1);
              opacity: 1;
            }
          }

          @keyframes fadein {
            to {
              opacity: 1;
            }
          }

          .letter {
            stroke-dasharray: 1400;
            stroke-dashoffset: 1400;
            animation: draw 1.4s ease forwards;
          }

          #w {
            animation-delay: .1s;
          }

          #i {
            animation-delay: .5s;
          }

          #g {
            animation-delay: .7s;
          }

          #o {
            animation-delay: 1s;
          }

          #o2 {
            animation-delay: 1.1s;
          }

          .mast {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: draw .7s ease .3s forwards;
          }

          .ring {
            transform-box: fill-box;
            transform-origin: center;
            opacity: 0;
            animation: ringpop .5s ease 1s forwards;
          }

          .wave {
            opacity: .25;
          }

          #wi1 {
            animation: pulse 2s ease-in-out 1.4s infinite;
          }

          #wi2 {
            animation: pulse 2s ease-in-out 1.4s infinite;
          }

          #wo1 {
            animation: pulse 2s ease-in-out 1.6s infinite;
          }

          #wo2 {
            animation: pulse 2s ease-in-out 1.6s infinite;
          }

          .tag {
            opacity: 0;
            animation: fadein .8s ease 1.5s forwards;
          }

          @media (prefers-reduced-motion: reduce) {
            .letter,
            .mast {
              stroke-dashoffset: 0;
              animation: none;
            }

            .ring,
            .tag {
              opacity: 1;
              animation: none;
            }

            .wave {
              opacity: 1;
              animation: none;
            }
          }
        </style>


        <!-- =========================
             ANTENNA
             Moved upward and centered
             above the I
             ========================= -->

        <g
          fill="none"
          stroke="#E8791E"
          stroke-width="11"
          stroke-linecap="round"
        >

          <!-- Inner waves -->
          <path
            id="wi1"
            class="wave"
            d="M 368 108 A 38 38 0 0 0 368 172"
          />

          <path
            id="wi2"
            class="wave"
            d="M 416 108 A 38 38 0 0 1 416 172"
          />

          <!-- Outer waves -->
          <path
            id="wo1"
            class="wave"
            d="M 347 92 A 62 62 0 0 0 347 188"
          />

          <path
            id="wo2"
            class="wave"
            d="M 437 92 A 62 62 0 0 1 437 188"
          />

        </g>


        <!-- Antenna mast -->
        <line
          class="mast"
          x1="392"
          y1="135"
          x2="392"
          y2="218"
          stroke="#E8791E"
          stroke-width="9"
          stroke-linecap="round"
        />

        <!-- Antenna ring -->
        <circle
          class="ring"
          cx="392"
          cy="119"
          r="14"
          fill="none"
          stroke="#E8791E"
          stroke-width="11"
        />


        <!-- =========================
             WIGO LETTERING
             ========================= -->

        <g
          fill="none"
          stroke="#FFFFFF"
          stroke-width="9"
          stroke-linejoin="round"
          stroke-linecap="round"
        >

          <!-- W -->
          <path
            id="w"
            class="letter"
            d="
              M 190 250
              L 190 362
              a 42 42 0 0 0 42 42
              a 42 42 0 0 0 39 -26
              a 42 42 0 0 0 39 26
              a 42 42 0 0 0 42 -42
              L 352 250
              L 326 250
              L 326 362
              a 15 15 0 0 1 -30 0
              L 296 250
              L 266 250
              L 266 362
              a 15 15 0 0 1 -30 0
              L 236 250
              Z
            "
          />


          <!-- I
               Moved from x=355 to x=375
               for more breathing room from W
          -->
          <rect
            id="i"
            class="letter"
            x="375"
            y="250"
            width="34"
            height="154"
            rx="6"
          />


          <!-- G -->
          <path
            id="g"
            class="letter"
            d="
              M 520 300
              a 44 44 0 0 0 -44 -50
              L 470 250
              a 42 42 0 0 0 -42 42
              L 428 362
              a 42 42 0 0 0 42 42
              L 478 404
              a 42 42 0 0 0 42 -42
              L 520 320
              L 476 320
              L 476 350
              L 491 350
              L 491 362
              a 11 11 0 0 1 -11 11
              L 470 373
              a 11 11 0 0 1 -11 -11
              L 459 294
              a 11 11 0 0 1 11 -11
              L 478 283
              a 13 13 0 0 1 13 15
              Z
            "
          />


          <!-- O -->
          <rect
            id="o"
            class="letter"
            x="558"
            y="250"
            width="88"
            height="154"
            rx="44"
          />

          <!-- O inner -->
          <rect
            id="o2"
            class="letter"
            x="585"
            y="278"
            width="34"
            height="98"
            rx="17"
          />

        </g>


        <!-- Tagline -->
        <text
          class="tag"
          x="404"
          y="450"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-weight="700"
          font-size="24"
          letter-spacing="8"
          fill="#FFFFFF"
        >
          CLICK I CONNECT I WIGO
        </text>

      </svg>

    </div>
  </div>

</body>
</html>
